[package]
name = "iluvatar"
version = "0.1.1"
edition = "2021"
rust-version = "1.73"
authors = ["Tibor Djurica Potpara"]
description = "Efficient random access to compressed tar and cpio archives via indexing and decompression checkpoints"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tibordp/iluvatar"
keywords = ["tar", "cpio", "archive", "compression", "random-access"]
categories = ["compression", "filesystem"]
readme = "README.md"
exclude = ["tests/vectors/", "reference/"]

[dependencies]
miniz_oxide = { version = "0.9", features = ["block-boundary"], optional = true }
bzip2 = { version = "0.5", optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
zstd = "0.13"
tar = "0.4"
tokio = { version = "1", features = ["rt", "macros", "io-util", "fs", "io-std"] }

[features]
default = ["gzip", "bz2", "xz", "zstandard"]
gzip = ["dep:miniz_oxide"]
bz2 = ["dep:bzip2"]
xz = []
zstandard = []
tokio = ["dep:tokio"]
cli = ["dep:clap"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "iluvatar"
path = "src/main.rs"
required-features = ["cli"]
