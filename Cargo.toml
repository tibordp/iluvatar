[package]
name = "supertar"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
description = "Efficient random access to compressed tar and cpio archives via indexing and decompression checkpoints"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/supertar"
keywords = ["tar", "cpio", "archive", "compression", "random-access"]
categories = ["compression", "filesystem"]
readme = "README.md"

[dependencies]
miniz_oxide = { version = "0.9", features = ["block-boundary"], optional = true }
bzip2 = { version = "0.5", optional = true }
xz2 = { version = "0.1", optional = true }
zstd = { version = "0.13", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
bzip2 = "0.5"
xz2 = "0.1"
zstd = "0.13"
tar = "0.4"

[features]
default = ["gzip", "bz2", "xz", "zstandard"]
gzip = ["dep:miniz_oxide"]
bz2 = ["dep:bzip2"]
xz = ["dep:xz2"]
zstandard = ["dep:zstd"]
